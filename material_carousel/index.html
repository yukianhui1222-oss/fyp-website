<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#40364e;background:transparent}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #9f82c4;outline-offset:3px}.shelf{border:1px solid #e2d8ef;border-radius:24px;padding:22px 0;background:radial-gradient(ellipse at 20% 0,#eae3fa,transparent 65%),#f8f6fc;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 22px}.bar strong{font-size:18px}.bar small{display:block;color:#82738f;margin-top:6px;font-size:13px}.control{border:1px solid #d8cbe7;border-radius:10px;background:#fff;color:#6d5589;padding:9px 14px;white-space:nowrap}.viewport{overflow-x:auto;padding:30px 0 24px;scrollbar-width:thin;scrollbar-color:#d9c9e9 transparent}.track{display:flex;width:max-content}.group{display:flex;gap:22px;padding:0 22px 0 0}.card{flex:0 0 235px;width:235px;min-height:255px;text-align:left;padding:24px;border:1px solid #e1d8eb;border-radius:18px;background:white;box-shadow:0 8px 18px #6b4c8f0b;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;gap:18px}.card:hover{transform:translateY(-7px);border-color:#baa0d5}.badge{align-self:flex-start;background:#efe6fa;color:#7e5c9d;border-radius:10px 10px 15px 10px;padding:12px;font-size:12px;font-weight:750;letter-spacing:.06em}.blue{background:#e4edfc;color:#5679a8}.rose{background:#fbe7ec;color:#a76178}.mint{background:#e1f1e8;color:#4e8167}.title{font-size:17px;font-weight:650;line-height:1.5;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tools{color:#82728f;font-size:12px;line-height:1.6;margin-top:auto}.hint{font-size:12px;color:#8d789f}.bottom{padding:0 22px;display:flex;gap:8px;align-items:center}.bottom small{margin-left:auto;color:#83788e;font-size:12px}dialog{width:min(600px,calc(100% - 28px));max-height:460px;overflow:auto;border:1px solid #d4c1e5;border-radius:24px;padding:28px;box-shadow:0 20px 70px #4f36682b;animation:zoom .22s ease-out;background:#fff}dialog::backdrop{background:#eee8f4e6;backdrop-filter:blur(4px)}.detail-top{display:flex;justify-content:space-between;align-items:center;gap:12px}dialog h2{font-size:24px;line-height:1.5;overflow-wrap:anywhere;margin:22px 0 12px}dialog p{color:#80708f;line-height:1.7}.open{width:100%;border:1px solid #d5c2e8;border-radius:12px;background:#eee5fa;color:#61457f;padding:14px;margin:18px 0;font-weight:650}.detail-nav{display:flex;justify-content:space-between;align-items:center}.detail-nav span{color:#87778f;font-size:13px}@keyframes zoom{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:500px){.bar{align-items:flex-start}.bar strong{font-size:16px}.card{flex-basis:205px;width:205px}dialog{padding:20px}dialog h2{font-size:20px}}

.shelf{position:relative}.bar{position:relative;z-index:1}.shelf:before{content:'✧';position:absolute;right:23%;top:12px;color:#c8b5dd;font-size:40px;pointer-events:none}.shelf:after{content:'✦';position:absolute;right:32%;top:52px;color:#dac49d;font-size:18px;pointer-events:none}.shelf-meta{display:flex;gap:10px;align-items:center;padding:16px 22px 0;flex-wrap:wrap}.shelf-meta span{font-size:12px;color:#79648d;background:#ffffffb3;border:1px solid #e4d8ee;border-radius:99px;padding:5px 11px}.shelf-meta .motion-state{background:transparent;border-color:transparent;color:#887892}.motion-state:before{content:'';display:inline-block;width:6px;height:6px;background:#8bbba8;border-radius:50%;margin-right:7px}.motion-state[data-paused="true"]:before{background:#b9a8ca}.card{position:relative;border-top:3px solid var(--accent,#d8c6ed)}.card:before{content:'';position:absolute;top:0;right:22px;width:15px;height:28px;background:var(--accent,#d8c6ed);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}.card-number{position:absolute;right:20px;top:46px;color:#a192ad;font-size:11px;font-weight:650;letter-spacing:.07em}.tools{display:flex;flex-wrap:wrap;gap:5px}.tools span{padding:3px 7px;background:#f7f4fb;border-radius:6px;border:1px solid #eee8f4;font-size:11px}.hint{border-top:1px solid #eee8f4;padding-top:12px;width:100%;display:flex;justify-content:space-between}.hint:after{content:'↗';color:#9878b7}.viewport{padding-top:24px}.bottom{padding-top:8px}@media(max-width:500px){.shelf:before,.shelf:after{display:none}.shelf-meta{gap:6px}.bar small{line-height:1.5}}
</style></head><body>
<section class="shelf" aria-label="Moving course material shelf"><div class="bar"><div><strong>Your floating bookshelf</strong><small>Choose a file to bring it into focus.</small></div><button class="control" id="pause">Pause</button></div><div class="shelf-meta"><span id="material-count">Your collection</span><span class="motion-state" id="motion-state">Moving gently</span></div><div class="viewport" id="viewport" tabindex="0" aria-label="Scroll through documents"><div class="track"><div class="group" id="original"></div><div class="group" id="copy" aria-hidden="true"></div></div></div><div class="bottom"><button class="control" id="left" aria-label="Scroll left">←</button><button class="control" id="right" aria-label="Scroll right">→</button><small>Click to enlarge · Open when ready</small></div></section>
<dialog id="detail" aria-labelledby="detail-title"><div class="detail-top"><span class="badge" id="detail-kind"></span><button class="control" id="close" aria-label="Close preview">✕</button></div><h2 id="detail-title"></h2><p id="detail-tools"></p><button class="open" id="open">Open material →</button><div class="detail-nav"><button class="control" id="prev">← Previous</button><span id="position"></span><button class="control" id="next">Next →</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let docs=[],signature='',selected=0,manualPause=matchMedia('(prefers-reduced-motion:reduce)').matches,hover=false,last=0,carry=0;const reduced=matchMedia('(prefers-reduced-motion:reduce)');
function send(type,data={}){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function paused(){return manualPause||hover||$('detail').open||document.hidden||document.hasFocus()&&$('viewport').contains(document.activeElement)}
function pauseLabel(){$('pause').textContent=manualPause?'Resume':'Pause';$('pause').setAttribute('aria-pressed',String(manualPause))}
function show(index){selected=(index+docs.length)%docs.length;const d=docs[selected];$('detail-title').textContent=d.title;$('detail-kind').textContent=d.kind;$('detail-kind').className='badge '+d.tone;$('detail-tools').textContent=d.tools.length?'Available: '+d.tools.join(' · '):'Saved course material';$('position').textContent=`${selected+1} / ${docs.length}`;if(!$('detail').open)$('detail').showModal()}
function card(d,index,duplicate){
 const b=document.createElement('button');b.className='card';b.style.setProperty('--accent',['#d5c3eb','#bed3ed','#badbcb','#eac7d2'][index%4]);
 if(duplicate)b.tabIndex=-1;b.setAttribute('aria-label','Preview '+d.title);
 const number=document.createElement('span');number.className='card-number';number.textContent=String(index+1).padStart(2,'0');number.setAttribute('aria-hidden','true');b.append(number);
 for(const [cls,text] of [['badge '+d.tone,d.kind],['title',d.title]]){const el=document.createElement('span');el.className=cls;el.textContent=text;b.append(el)}
 const tools=document.createElement('span');tools.className='tools';for(const label of d.tools.length?d.tools:['Saved material']){const chip=document.createElement('span');chip.textContent=label;tools.append(chip)}b.append(tools);
 const hint=document.createElement('span');hint.className='hint';hint.textContent='Bring into focus';b.append(hint);b.onclick=()=>show(index);return b
}
window.addEventListener('message',event=>{if(event.source!==parent||event.data.type!=='streamlit:render')return;const incoming=event.data.args.documents||[],next=JSON.stringify(incoming);if(next!==signature){signature=next;docs=incoming;$('material-count').textContent=docs.length+' '+(docs.length===1?'material':'materials')+' in this collection';$('detail').close();$('original').replaceChildren();$('copy').replaceChildren();docs.forEach((d,i)=>{$('original').append(card(d,i,false));if(docs.length>1)$('copy').append(card(d,i,true))});$('viewport').scrollLeft=0;$('pause').disabled=docs.length<2}send('streamlit:setFrameHeight',{height:560})});
new ResizeObserver(()=>{for(const id of ['original','copy'])$(id).style.minWidth=$('viewport').clientWidth+'px'}).observe($('viewport'));
$('pause').onclick=()=>{manualPause=!manualPause;pauseLabel()};reduced.addEventListener('change',e=>{manualPause=e.matches;pauseLabel()});$('viewport').onmouseenter=()=>hover=true;$('viewport').onmouseleave=()=>hover=false;$('viewport').addEventListener('touchstart',()=>{manualPause=true;pauseLabel()},{passive:true});$('close').onclick=()=>$('detail').close();$('prev').onclick=()=>show(selected-1);$('next').onclick=()=>show(selected+1);$('left').onclick=()=>{manualPause=true;pauseLabel();$('viewport').scrollLeft=Math.max(0,$('viewport').scrollLeft-257)};$('right').onclick=()=>{manualPause=true;pauseLabel();$('viewport').scrollLeft+=257};$('open').onclick=()=>{send('streamlit:setComponentValue',{value:{id:docs[selected].id,event:crypto.randomUUID()},dataType:'json'});$('detail').close()};
function animate(now){const stopped=paused()||docs.length<2;const label=docs.length<2?'Ready to explore':stopped?'Paused for browsing':'Moving gently';if($('motion-state').textContent!==label){$('motion-state').textContent=label;$('motion-state').dataset.paused=String(stopped)}const dt=Math.min(now-last,50);last=now;const width=$('original').offsetWidth;if(docs.length>1&&!paused()&&width){carry+=dt*.025;const pixels=Math.floor(carry);carry-=pixels;$('viewport').scrollLeft+=pixels;if($('viewport').scrollLeft>=width)$('viewport').scrollLeft-=width}requestAnimationFrame(animate)}pauseLabel();send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:560});requestAnimationFrame(animate);
</script></body></html>
